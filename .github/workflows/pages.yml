name: Bouwen en publiceren

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Valideren, redeneren en bouwen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Afhankelijkheden installeren
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Tests (SHACL en redeneren)
        run: pytest -v

      - name: Site bouwen
        run: python scripts/build.py --out dist

      - name: Voorbeeldqueries uitvoeren in Oxigraph
        run: node --test tests/queries.test.mjs

      - name: Samenvatting
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("dist/data/meta.json"))
          t = m["triples"]
          print("## Hello Semantica")
          print("| | |\n|---|---|")
          print(f"| Beweerde feiten | {t['feiten']} |")
          print(f"| Afgeleide feiten | {t['afgeleid']} |")
          print(f"| Ontologie-triples | {t['ontologie']} |")
          print(f"| Resources | {m['resources']} |")
          print(f"| SHACL | {'✅ conform' if m['shacl']['conform'] else '❌'} |")
          print(f"| Schendingen in het ongeldige voorbeeld | {len(m['ongeldigVoorbeeld'])} (verwacht) |")
          PY

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: Publiceren op GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
